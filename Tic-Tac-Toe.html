<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Graph Paper Tic-Tac-Toe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: one narrow centered column on graph paper (chalkboard in dark): title, score row, hand-drawn board, controls. */
:root {
  --paper: #f5f8fb;
  --rule: #d6e2ee;
  --ink: #1f2a44;
  --muted: #5d6b85;
  --x: #c8372d;
  --o: #2456b8;
  --panel: #ffffff;
  --edge: #b9c8d9;
  --hover: #e6eef6;
  --display: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --ui: "Karla", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1e2c29; --rule: #263733; --ink: #edece3; --muted: #a4b3ac;
    --x: #ff9d8a; --o: #8fd0f0; --panel: #24342f; --edge: #47605a; --hover: #2a3d38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1e2c29; --rule: #263733; --ink: #edece3; --muted: #a4b3ac;
  --x: #ff9d8a; --o: #8fd0f0; --panel: #24342f; --edge: #47605a; --hover: #2a3d38;
  color-scheme: dark;
}

body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 28px 40px;
}
.game {
  max-width: 420px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 2.4rem;
  line-height: 1.1;
  margin: 0;
  text-align: center;
  text-wrap: balance;
}
h1 .x { color: var(--x); }
h1 .o { color: var(--o); }

.score {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: end;
  text-align: center;
}
.score div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.score .who {
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.score .n {
  font-family: var(--display);
  font-weight: 700;
  font-size: 2rem;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  border-bottom: 3px solid transparent;
  padding-bottom: 4px;
}
.score .px .n { color: var(--x); }
.score .po .n { color: var(--o); }
.score .active .n { border-bottom-color: currentColor; }

.status {
  font-family: var(--display);
  font-size: 1.35rem;
  text-align: center;
  min-height: 1.9rem;
  margin: 0;
}

.board {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1;
}
.board > svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.lines path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.strike line {
  stroke: var(--ink);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  opacity: 0;
}
.strike.on line { opacity: 0.85; animation: draw 0.35s 0.25s ease-out forwards; }

.cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
}
.cell {
  appearance: none;
  background: transparent;
  border: 0;
  border-radius: 10px;
  margin: 6px;
  padding: 0;
  cursor: pointer;
  color: inherit;
}
.cell:hover:not([data-mark]) { background: var(--hover); }
.cell[data-mark], .over .cell { cursor: default; }
.cell:focus-visible, .btn:focus-visible, .seg input:focus-visible + label {
  outline: 3px solid var(--o);
  outline-offset: 2px;
}
.cell svg { width: 100%; height: 100%; display: block; }
.cell path {
  fill: none;
  stroke-width: 9;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 0.22s ease-out forwards;
}
.cell path + path { animation-delay: 0.16s; }
.cell[data-mark="X"] path { stroke: var(--x); }
.cell[data-mark="O"] path { stroke: var(--o); animation-duration: 0.36s; }
.over .cell:not(.won) svg { opacity: 0.45; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .cell path, .strike.on line { animation: none; stroke-dashoffset: 0; }
}

.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > * { flex: 1 1 140px; }
.seg {
  display: flex;
  border: 1.5px solid var(--edge);
  border-radius: 8px;
  background: var(--panel);
  overflow: hidden;
  margin: 0;
  padding: 0;
  min-width: 0;
}
.seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  flex: 1;
  text-align: center;
  padding: 9px 8px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--muted);
  cursor: pointer;
}
.seg input:checked + label { background: var(--ink); color: var(--paper); }
.btn {
  font: inherit;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--edge);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { opacity: 0.88; background: var(--ink); }
</style>

<main class="game">
  <h1>Tic<span class="x">-</span>Tac<span class="o">-</span>Toe</h1>

  <div class="score">
    <div class="px" id="score-x"><span class="n" id="n-x">0</span><span class="who" id="who-x">You (X)</span></div>
    <div><span class="n" id="n-d">0</span><span class="who">Draws</span></div>
    <div class="po" id="score-o"><span class="n" id="n-o">0</span><span class="who" id="who-o">Computer (O)</span></div>
  </div>

  <p class="status" id="status" aria-live="polite">Your turn</p>

  <div class="board" id="board">
    <svg class="lines" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M100 8 Q104 150 99 292"/>
      <path d="M200 10 Q196 150 201 290"/>
      <path d="M8 100 Q150 96 292 101"/>
      <path d="M10 200 Q150 204 290 199"/>
    </svg>
    <div class="cells" id="cells"></div>
    <svg class="strike" id="strike" viewBox="0 0 300 300" aria-hidden="true">
      <line id="strike-line" pathLength="1" x1="0" y1="0" x2="0" y2="0"/>
    </svg>
  </div>

  <div class="controls">
    <div class="row">
      <fieldset class="seg">
        <legend>Opponent</legend>
        <input type="radio" name="mode" id="mode-cpu" value="cpu" checked><label for="mode-cpu">Computer</label>
        <input type="radio" name="mode" id="mode-friend" value="friend"><label for="mode-friend">Friend</label>
      </fieldset>
      <fieldset class="seg" id="level-seg">
        <legend>Difficulty</legend>
        <input type="radio" name="level" id="level-easy" value="easy"><label for="level-easy">Easy</label>
        <input type="radio" name="level" id="level-hard" value="hard" checked><label for="level-hard">Unbeatable</label>
      </fieldset>
    </div>
    <div class="row">
      <button class="btn primary" id="new-round" type="button">New round</button>
      <button class="btn" id="reset-score" type="button">Reset score</button>
    </div>
  </div>
</main>

<script>
(function () {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const MARKS = {
    X: '<svg viewBox="0 0 100 100" aria-hidden="true"><path pathLength="1" d="M23 22 Q50 47 79 78"/><path pathLength="1" d="M78 21 Q52 50 22 80"/></svg>',
    O: '<svg viewBox="0 0 100 100" aria-hidden="true"><path pathLength="1" d="M52 18 C28 15 15 36 18 55 C21 75 39 86 57 82 C75 78 86 60 82 42 C78 26 63 15 45 19"/></svg>'
  };
  const $ = (id) => document.getElementById(id);
  const cellsEl = $('cells'), boardEl = $('board'), strike = $('strike'), strikeLine = $('strike-line');
  const cells = [];
  let s, cpuTimer = 0;

  function fresh() {
    return { board: Array(9).fill(null), turn: 'X', starter: 'X', mode: 'cpu', level: 'hard',
             score: { X: 0, O: 0, D: 0 }, over: false, win: null };
  }

  function winner(b) {
    for (const l of LINES) {
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { mark: b[l[0]], line: l };
    }
    return null;
  }

  // Minimax scored from O's side; depth makes it prefer quick wins and slow losses.
  function mm(b, player, depth) {
    const w = winner(b);
    if (w) return w.mark === 'O' ? 10 - depth : depth - 10;
    if (b.every(Boolean)) return 0;
    let best = player === 'O' ? -Infinity : Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = player;
      const sc = mm(b, player === 'O' ? 'X' : 'O', depth + 1);
      b[i] = null;
      best = player === 'O' ? Math.max(best, sc) : Math.min(best, sc);
    }
    return best;
  }

  function pickMove() {
    const b = s.board.slice();
    const empty = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
    const rand = (a) => a[Math.floor(Math.random() * a.length)];
    if (s.level === 'easy' && Math.random() < 0.55) return rand(empty);
    let best = -Infinity, moves = [];
    for (const i of empty) {
      b[i] = 'O';
      const sc = mm(b, 'X', 1);
      b[i] = null;
      if (sc > best) { best = sc; moves = [i]; }
      else if (sc === best) moves.push(i);
    }
    return rand(moves);
  }

  function move(i) {
    s.board[i] = s.turn;
    const w = winner(s.board);
    if (w) { s.over = true; s.win = w.line; s.score[w.mark]++; }
    else if (s.board.every(Boolean)) { s.over = true; s.score.D++; }
    else s.turn = s.turn === 'X' ? 'O' : 'X';
    render();
    maybeCpu();
  }

  function maybeCpu() {
    if (s.over || s.mode !== 'cpu' || s.turn !== 'O') return;
    const t = ++cpuTimer;
    setTimeout(() => { if (t === cpuTimer && !s.over) move(pickMove()); }, 500);
  }

  function onCell(i) {
    if (s.over || s.board[i]) return;
    if (s.mode === 'cpu' && s.turn === 'O') return;
    move(i);
  }

  function newRound(alternate) {
    cpuTimer++;
    if (alternate) s.starter = s.starter === 'X' ? 'O' : 'X';
    s.board = Array(9).fill(null);
    s.turn = s.starter;
    s.over = false;
    s.win = null;
    render();
    maybeCpu();
  }

  function statusText() {
    const cpu = s.mode === 'cpu';
    if (s.over) {
      if (!s.win) return 'Draw';
      const m = s.board[s.win[0]];
      return cpu ? (m === 'X' ? 'You win!' : 'Computer wins') : m + ' wins!';
    }
    if (cpu) return s.turn === 'X' ? 'Your turn' : 'Computer is thinking…';
    return s.turn + ' to play';
  }

  function render() {
    cells.forEach((c, i) => {
      const m = s.board[i] || '';
      if ((c.dataset.mark || '') !== m) {
        if (m) { c.dataset.mark = m; c.innerHTML = MARKS[m]; }
        else { delete c.dataset.mark; c.innerHTML = ''; }
      }
      c.classList.toggle('won', !!s.win && s.win.includes(i));
      c.setAttribute('aria-label', 'Row ' + (Math.floor(i / 3) + 1) + ', column ' + (i % 3 + 1) + ', ' + (m || 'empty'));
    });
    boardEl.classList.toggle('over', s.over);

    if (s.win) {
      const p = (i) => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
      const [ax, ay] = p(s.win[0]), [bx, by] = p(s.win[2]);
      const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len * 32, uy = (by - ay) / len * 32;
      strikeLine.setAttribute('x1', ax - ux); strikeLine.setAttribute('y1', ay - uy);
      strikeLine.setAttribute('x2', bx + ux); strikeLine.setAttribute('y2', by + uy);
    }
    strike.classList.toggle('on', !!s.win);

    $('n-x').textContent = s.score.X;
    $('n-o').textContent = s.score.O;
    $('n-d').textContent = s.score.D;
    const cpu = s.mode === 'cpu';
    $('who-x').textContent = cpu ? 'You (X)' : 'Player X';
    $('who-o').textContent = cpu ? 'Computer (O)' : 'Player O';
    $('score-x').classList.toggle('active', !s.over && s.turn === 'X');
    $('score-o').classList.toggle('active', !s.over && s.turn === 'O');
    $('status').textContent = statusText();
    $('level-seg').hidden = !cpu;
    $('mode-' + s.mode).checked = true;
    $('level-' + s.level).checked = true;
    $('new-round').textContent = s.over ? 'Play again' : 'New round';
  }

  function start(data) {
    s = Object.assign(fresh(), data && data.board ? data : {});
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'cell';
      c.id = 'cell-' + i;
      c.addEventListener('click', () => onCell(i));
      cellsEl.appendChild(c);
      cells.push(c);
    }
    document.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener('change', () => {
      s.mode = r.value;
      s.score = { X: 0, O: 0, D: 0 };
      s.starter = 'X';
      newRound(false);
    }));
    document.querySelectorAll('input[name="level"]').forEach((r) => r.addEventListener('change', () => {
      s.level = r.value;
    }));
    $('new-round').addEventListener('click', () => newRound(s.over));
    $('reset-score').addEventListener('click', () => { s.score = { X: 0, O: 0, D: 0 }; render(); });
    render();
    maybeCpu();
  }

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => s);
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

</body></html>
